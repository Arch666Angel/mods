[tips-and-tricks-name]
angelsaddons-mobility=Angel's Addons (Massenverkehr) Mobilität

[tips-and-tricks-description]
angelsaddons-mobility=Dieser Mod fügt eine Vielzahl von Angels-Themenzügen unabhängig vom Angels-Modset hinzu.\nDie drei Themenzüge sind [img=item/crawler-locomotive]Crawler, [img=item/smelting-locomotive-1]Smelting und [img=item/petro-locomotive-1]Petrochem.\nJedes Zugthema hat unterschiedliche Arbeitswerte wie Masse, Leistung, Kapazität, Bremsleistung und Höchstgeschwindigkeit.\n\n[font=default-bold]HINWEIS[/font]: Jeder Zug (mit einigen kleinen Ausnahmen) verfügt über kompatible Copy-and-Paste-Informationen wie Fahrplan und Farbe. Diese sind auch mit den Blaupausen kompatibel.
angelsaddons-mobility-notes=\n[font=default-bold]HINWEIS[/font]: Tender sind Lokomotiven mit hohem Luftwiderstand, aber hoher Leistung, gut als Zweitlokomotive für größere Züge.\n[font=default-bold]HINWEIS[/font]: Bot-Waggons sind Güterwaggons, die Roboport-Ausrüstung nutzen können.
