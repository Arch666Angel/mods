[tips-and-tricks-description]
angelsbioprocessing-intro=Erkunden Sie den fremden Planeten, um die Flora (Pflanzenwelt) und Fauna (Tierwelt) zu finden und zu Ihrem Vorteil zu nutzen. Dieser Mod bietet Alternativen zu petrochemischen Prozessen und fördert die Erkundung der Umgebung.\n
angelsbioprocessing-intro-nauvis=[font=default-bold]Nauvis-Verarbeitung[/font]:\n - [img=item/algae-farm]Algenzucht, frühe Anbaumethoden für Pflanzen.\n - [img=item/bio-arboretum-1]Baumzucht basierend auf dem Anbau einheimischer Bäume für Holz, Harz, Kunststoff und Gummi.\n
angelsbioprocessing-intro-vegetables=\n[font=default-bold]Gemüseverarbeitung[/font]:\n - [img=item/desert-garden]Einige einheimische Pflanzen enthalten Samen, aus denen Nutzpflanzen gewonnen werden.\n - [img=item/crop-farm]Pflanze und baue diese Nutzpflanzen an, um nützliche Produkte zu erhalten.\n
angelsbioprocessing-intro-animals=\n[font=default-bold]Tierverarbeitung[/font]:\n - [img=item/bio-refugium-fish]Einige einheimische Fische sind eine nützliche Quelle für Nahrung und ölbasierte Produkte.\n - [img=item/bio-refugium-puffer]Einige kleine einheimische Flugtiere sind recht geschickt darin, gefährliche gasförmige Produkte in nützliche Produkte umzuwandeln.

angelsbioprocessing-nauvis=Die Erforschung und Nutzung von Algen mit hoher Wachstumsrate ist der erste Teil dieses Mods. Das Auffinden spezialisierter Bäume in verschiedenen Biomen ermöglicht das Wachstum von Bäumen auf erneuerbare Weise, während Algenfarmen minderwertige Pflanzen mit hohem Wasserverbrauch für nützliche frühe Materialien wie Zellulose und Methanol kultivieren.\nEin kleiner Einblick in die Art und Weise, wie die Welt im vorindustriellen Zeitalter Pflanzen für Nicht-Lebensmittel nutzte.\n\nDieser Teil des Mods konzentriert sich auf das Wachstum von Algen und Bäumen mithilfe von Abfallstoffen und Wasser.
nauvis-algae=Erforschung und Nutzung von schnell wachsenden Algen für nützliche Produkte.\n\n
nauvis-notes-algae-green=[font=default-bold]HINWEIS[/font]: Methanol wird umgangssprachlich als Holzalkohol bezeichnet, da es typischerweise durch Verbrennen von Holz und Destillieren der Dämpfe hergestellt wurde.\n\n
nauvis-notes-algae-brown=[font=default-bold]HINWEIS[/font]: Natriumcarbonat wurde traditionell durch Trocknen und Verbrennen von Seetang hergestellt, bevor die industrielle Revolution alternative und nachhaltigere Methoden hervorbrachte.\n Alginsäure kommt typischerweise in den Zellwänden von Pflanzen vor und ist ziemlich klebrig. Sie ist in Pflanzenharzen in hohen Konzentrationen enthalten und kann daher als Bindemittel bei der Papierherstellung verwendet werden.\n\n
nauvis-notes-algae-brown-bobs= - Braunalgen können auch zu [img=item/solid-lithium]Lithiumsalz verarbeitet werden, als Alternative zur Verwendung von [img=fluid/thermal-water]Thermalwasser.\n
nauvis-notes-algae=\n[font=default-bold]HINWEIS[/font]: Die Algenverarbeitung wird typischerweise zu Beginn des Spiels zur Herstellung komplexer Materialien eingesetzt, bis andere Methoden eingesetzt werden können. Dies liegt daran, dass die Bioverarbeitung typischerweise langsam ist und sich nicht so einfach an spätere Anforderungen anpassen lässt.
nauvis-trees=Beim Erkunden des Planeten findest du neben den Nadelbäumen des Basisspiels auch verschiedene Laubbaumarten. Extrahiere Samen aus diesen Bäumen und züchte deine eigenen Bäume als erneuerbare [img=item/wood]Holzquelle. Fortgeschrittenere Verarbeitung führt zu einem intensiveren Baumwachstum, wodurch du Harz, Plastik und Gummi aus diesen speziellen Bäumen gewinnen kannst.\n\nDiese Bäume sind auf der Minikarte mit einem [font=default-bold]hellblauen Quadrat[/font] markiert und befinden sich je nach Feuchtigkeitsgrad in verschiedenen Biomen.\n
nauvis-notes-trees=[font=default-bold]HINWEIS[/font]: Da die Platzierungsorte der speziellen Bäume von der Feuchtigkeit und nicht von spezifischen „Biomen“ abhängen, blockieren Mods wie Alien-Biome das Erscheinen von Bäumen nicht. Die Spawnrate dieser Bäume ist jedoch recht niedrig. nauvis-arbor=Mithilfe der speziellen Bäume können Sie Samengeneratoren herstellen, die die Bäume verbrauchen, um zum Preis leicht erhältlicher Materialien ([img=item/solid-mud] Schlamm, [img=item/solid-soil] Erde, [img=item/solid-sand] Sand) und etwas Feuchtigkeit ([img=fluid/water] Wasser, [img=fluid/water-light-mud] leichtes Schlammwasser oder [img=fluid/water-saline] Salzwasser) Samen zu erzeugen.\nDiese Samen können dann in einem [img=item/bio-arboretum-1] Arboretum kultiviert werden, um [img=item/solid-tree] Bäume für Holz oder Bäume und Saft zu erzeugen, je nach Baumart (siehe vorherigen Tipp).
nauvis-arbor-compost=\n\n[font=default-bold]HINWEIS[/font]: Um die für die Arboreten benötigte Erde oder den Dünger zu erhalten (einige Rezepte erfordern weder das eine noch das andere), müssen Sie Kompost herstellen.\n - [img=item/solid-compost] Kompost kann erzeugt werden, indem die meisten Bioprozessmaterialien (Algen, Holz, Zellulose, Samen, Feldfrüchte) an einen [img=item/composter] Komposter geschickt werden.\nEine vollständige Liste der kompostierbaren Materialien finden Sie im Zutatenfach des Komposters. Nicht alle Komposte sind 1:1, halten Sie also nach effizienteren Materialien Ausschau.\nSpätere Technologien ermöglichen es Ihnen, diese besonderen Bäume zu duplizieren, aber Sie müssen sie frühzeitig in der Wildnis finden.

angelsbioprocessing-vegetables=Bei der Erkundung des Planeten findest du [img=item/desert-garden][img=item/wamp-garden][img=item/temperate-garden]Gärten, die du untersuchen und zu Samen verarbeiten kannst. Mit diesen Samen kannst du selbst Pflanzen anbauen. Verarbeite diese Pflanzen zu Nährstoffen, Treibstoff und Ölen. Diese Gärten können auch zu [img=item/token-bio]Pflanzenproben verarbeitet werden, die für die Erforschung fortschrittlicher landwirtschaftlicher Gebäude wie Farm-Upgrades, effizienterer Holzrezepte und fortschrittlicherer Prozesse verwendet werden können.\n\nDiese Gärten sind auf der Minikarte mit einem [font=default-bold]hellgrünen Quadrat[/font] markiert und befinden sich je nach Feuchtigkeitsgehalt in verschiedenen Biomen.\n
vegetables-farming=Sobald die Gärten in einem [img=item/seed-extractor]Samenextraktor verarbeitet wurden, um Saatgut zu erhalten, können die Pflanzen gepflanzt und zu nützlichen Produkten kultiviert werden.\n\n
vegetables-notes-gardens=\n\n[font=default-bold]HINWEIS[/font]: Da die Platzierungsorte der Gärten feuchtigkeitsabhängig sind (wie bei Bäumen) und nicht auf bestimmte „Biome“ beschränkt sind, blockieren Mods wie Alien-Biome das Spawnen von Gärten nicht. Die Spawnrate dieser Bäume ist jedoch recht niedrig. vegetables-crops=Die Ergebnisse der Verarbeitung der Nutzpflanzen im [img=item/bio-processor]Bioprozessor führen je nach Rezeptur zu bestimmten Ergebnissen. Diese können eine Mischung aus den folgenden sein:\n
vegetables-notes-crops=\n\n[font=default-bold]HINWEIS[/font]:\nNur [img=item/solid-corn]Mais und [img=item/solid-fruit]Obst können in [img=fluid/liquid-fermentation-raw]Fermentationsgrundlage für die Umwandlung in [img=fluid/gas-ethanol]Ethanol oder [img=fluid/liquid-acetic-acid]Essigsäure umgewandelt werden.\nAlle nicht-fortgeschrittenen Produkte können in [img=fluid/liquid-nutrient-pulp]Nährstoffbrei umgewandelt werden, um daraus das sehr nützliche [img=fluid/gas-acetone]Aceton sowie eine Vielzahl anderer petrochemischer Produkte von Ölen bis hin zu Synthesegas herzustellen.

angelsbioprocessing-animals=[font=default-bold]FANGEN, ERKUNDEN, VERSUCHEN[/font]:\n\nDieser Teil der Mod konzentriert sich auf die Tierwelt von Nauvis, von der Fischzucht, Kugelfischzucht und -aufzucht bis hin zur Zucht von Beißern für fortschrittliche Materialien, die in Dingen wie Raketentreibstoff, Modulen oder fortschrittlichen Waffen verwendet werden.\n
animals-notes-fish=\n[font=default-bold]FISCH[/font]: Fange Fische (4 Sorten [img=item/raw-fish] [img=item/alien-fish-1-raw] [img=item/alien-fish-2-raw] [img=item/alien-fish-3-raw]) und züchte sie als erneuerbare Methode zur Regeneration deiner Gesundheit oder als [img=item/bio-raw-meat] Nahrung für spätere Tiere. Fisch kann auch zu Öl und [img=item/fish-pulp] Zellstoff verarbeitet werden, der in ähnlichen Prozessen wie in der Landwirtschaft verwendet wird. [img=fluid/liquid-polluted-fish-atmosphere] Verschmutztes Fischwasser kann verarbeitet werden, um [img=item/crystal-splinter-raw] Kristallsplitter für die Kristallverarbeitung zu gewinnen.
animals-notes-puffers=\n\n[font=default-bold]KUGELFISCH[/font]: Erkunde den Planeten, um [img=item/puffer-nest] Puffernester zu finden und Puffereier zu erhalten (nur [img=item/bio-puffer-1] gasförmige Puffers sind in freier Wildbahn zu finden, [font=default-bold]gelbes Quadrat[/font] auf der Karte). Züchte deine stinkenden Puffers, um verschiedene Möglichkeiten zur Gasverarbeitung zu erlernen. Das Ausbrüten von Eiern im Brutzyklus ergibt [img=item/bio-puffer-egg-shell] Eierschalen, die zermahlen und mit verschmutztem Fischwasser kombiniert werden können, um eine höherwertige [img=item/crystal-shard-raw] Kristallscherbe zu erzeugen.\n[font=default-bold]HINWEISE:[/font] Vorsicht vor dem Mutationsrisiko von Kugelfischen.
animals-notes-biters=\n\n[font=default-bold]BEISSER[/font]: Experimentiere mit deinen Kugelfischen, vielleicht kannst du dann selbst ein paar zahme Beißer züchten. Untersuchen Sie sie, um Kristalle zu erhalten, die nützlich sein können, um die Produktivität Ihrer Fabrik zu steigern oder sie zu beschleunigen.\nDas Züchten der Beißer mithilfe von Königinnen kann alle drei Kristallstufen ([img=item/crystal-splinter-raw]Splitter, [img=item/crystal-shard-raw]Scherben und [img=item/crystal-full-raw] Rohkristalle) basierend auf der Größe (klein, mittel, groß) ergeben.\n[font=default-bold]HINWEISE:[/font] Beißer fressen ziemlich viel [img=item/bio-alien-processed-meat] von Aliens verarbeitetes Fleisch. Stellen Sie daher sicher, dass Sie genügend [img=item/bio-butchery] zerlegte Kugelfische und Fische zur Verfügung haben, sobald Sie dieses Stadium erreicht haben.

[tips-and-tricks-sub]
algae-green=Diese leben von [img=fluid/water-mineralized] mineralisiertem Wasser und produzieren [img=item/cellulose-fiber] Fasern, die [img=fluid/gas-methanol] Methanol produzieren können.
algae-brown=Diese leben von [img=fluid/water-saline] salzhaltigem Wasser und produzieren [img=item/solid-sodium-carbonate] Natriumcarbonat und [img=item/solid-alginic-acid] Alginsäure, die mit den [img=item/cellulose-fiber] Fasern kombiniert werden kann, um [img=item/solid-paper] Papier herzustellen.
algae-blue=Diese leben von [img=fluid/water-yellow-waste] schwefelhaltigem Abwasser und [img=fluid/gas-carbon-dioxide] Kohlendioxid. Sie produzieren stickstoffreiche Verbindungen wie [img=fluid/gas-ammonia] Ammoniak.\n
algae-red=Diese leben von [img=fluid/thermal-water] Thermalwasser und [img=fluid/gas-ammonia] Ammoniak. Sie produzieren kalziumreiche Verbindungen wie [img=item/solid-calcium-carbonate] Kalziumkarbonat.\n
trees-swamp=Sumpfbäume kommen in feuchten Gebieten vor und bevorzugen einen Feuchtigkeitsgehalt von etwa __1__ (typischerweise dunkelgrüne oder blaue Grasflächen). Sumpfbäume werden zur Holzproduktion oder als frühe Quelle für [img=item/bio-plastic] Kunststoff verwendet.\n\n
trees-temperate=Sumpfbäume kommen in gemäßigten Gebieten vor und bevorzugen einen Feuchtigkeitsgehalt von etwa __1__ (typischerweise hellgrüne Grasflächen). Bäume aus gemäßigten Gebieten werden zur Holzproduktion oder als frühe Quelle für [img=item/bio-resin] Harzproduktion verwendet.\n
trees-desert=Wüstenbäume kommen in trockenen Gebieten vor und bevorzugen einen Feuchtigkeitsgehalt von etwa __1__ (typischerweise sandige/rotsandige Gebiete). Wüstenbäume werden zur Holzproduktion oder als frühe Quelle für [img=item/bio-rubber] Kautschukproduktion.\n
farm-seeds-to-crops=\nPlatziere diese Pflanzen auf einer [img=item/crop-farm] Basisfarm oder der entsprechenden, verbesserten Farm ([img=item/swamp-farm] Sumpf, [img=item/temperate-farm] gemäßigtes Klima, [img=item/desert-farm] Wüste), um sie anzubauen.\nDie Pflanzen können in einem [img=item/bio-processor] Bioprozessor verarbeitet werden. Die Samen können zur Regeneration an einen [img=item/seed-extractor] Samenextraktor zurückgegeben werden.\n\n
crops-special-products=\nEinschließlich der folgenden Produkte aus den fortschrittlichsten Pflanzen ([img=item/swamp-5], [img=item/temperate-5], [img=item/desert-5]):
fish-artifacts= Verarbeitet ihr Wasser, um [img=fluid/alien-spores] Alien-Sporen zu extrahieren, die weiter zu [img=item/alien-artifact] Alien-Artefakten verarbeitet werden können.
