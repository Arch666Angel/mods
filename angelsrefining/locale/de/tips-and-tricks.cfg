[tips-and-tricks-description]
angelsrefining=Eine Mod, der zusammengesetzte Erze einführt, die erst veredelt werden müssen, bevor man sie schmelzen und in Platten gießen kann.

; 1. Ore generation
angels-ore-generation=Diese Mod [tooltip=Angels refining,tips-and-tricks-description.angelsrefining] ersetzt alle Erzfelder durch neue Erze, die Du vor dem Schmelzen raffinieren musst. Alle schmelzbaren Erze (aus Vanilla/Bobs/YI) werden durch neue zusammengesetzte Erze ersetzt: \n\n__1__\n Es gibt auch einen neuen Brunnen: __2__

; 1.1. Ore refining
angels-ore-refining=Die abgebauten zusammengesetzten Erze müssen veredelt werden, bevor man sie verhütten und in Platten gießen kann. Fortgeschrittenere Veredelungsmethoden führen zu einer höheren Ausbeute an verarbeiteten Erzen und können neue veredelte Erze freischalten.\n\nEs gibt derzeit 3 verschiedene Modi:\n    - Vanilla: Veredelung für eine höhere Ausbeute an Eisen- und Kupfererz.\n    - Pure Angels: Veredelung für eine Vielzahl von Materialien.\n    - Bobs-Angels (auch bekannt als BA oder AB): Veredelung für eine Vielzahl von modifizierten Erzen. \n\nWirkt gut in Verbindung mit Bobmods und unterstützt andere Mods wie Yuoki Industries (und die leider verlorenen Mods: Uranium Power und Nuclear.)\nDieser Mod fügt auch fortschrittliche Erzverarbeitung hinzu, wie z.B. Erzbrechung, Flotation, Säureauslaugung und Kristallisation, um die Erzausbeute und Effizienz zu verbessern. Ein weiterer Bestandteil des Mods sind Abwasserreinigungssysteme für diese und andere Verarbeitungsketten.\nDie in diesem Mod hinzugefügten Wasserverarbeitungs- und Raffinationsketten werden im gesamten Technologiebaum erforscht.

angels-crushing=Der erste Schritt nach dem Abbau ist das Zerkleinern des Erzes in etwas, das verarbeitet werden kann. Das Zerkleinern nimmt das aus dem Boden gegrabene Erz und bricht den harten Stein von den nützlichen Materialien ab. Das allgemeine Rezept nimmt zusammengesetztes Erz auf und gibt zerkleinertes Erz [img=item/stone-crushed] zerkleinerten Stein aus. \Der [img=item/stone-crushed] gebrochene Stein kann im mittleren Spiel zu anderen Materialien verarbeitet werden, aber schon früh kann er zu [img=item/stone] Stein zu [img=item/stone-brick] Steinziegeln und [img=item/stone-wall] Mauern verarbeitet werden. Das gebrochene Erz kann in manchen Fällen direkt verhüttet, weiterverarbeitet oder sortiert werden.
angels-crushing-notes=\n\n[font=default-bold]HINWEISE[/font]: Beispiele für die Zerkleinerung von Erzen in der Praxis sind Kugel-, Backen-, Druckluft- und Prallbrecher. Damit wird das Erz in kleinere Stücke gebrochen, so dass die chemische Verarbeitung mehr der nützlichen Teile erreichen kann, insbesondere im nächsten Schritt (Flotation).
angels-floatation=Die Aufschwämmung ist ein sekundärer Raffinationsschritt, bei dem das zerkleinerte Erz weiter gewaschen wird, um weitere Verunreinigungen aus dem zerkleinerten Erz zu entfernen; dies ist der erste der chemischen Raffinationsschritte, bei dem gereinigtes Wasser verwendet wird. Es ist ratsam, ein Wasserreinigungssystem in der Nähe zu haben, und ein Abwasserreinigungssystem für das Nebenprodukt. Ein Nebeneffekt sind Geoden, kristalline Materialien, die häufig in Böden und Steinen zu finden sind.\n\Nach dem allgemeinen Rezept wird zerkleinertes Erz mit etwas [img=fluid/water-purified] gereinigtem Wasser in Erzbrocken, eine Chance auf eine Geode und etwas Abwasser umgewandelt.\nGeoden können je nach den installierten Mods zu einer Vielzahl verschiedener Dinge verarbeitet werden.\nDie Brocken können sortiert oder im nächsten Schritt, dem Auslaugen, weiter gereinigt werden.
angels-floatation-notes=\n\n[font=default-bold]HINWEISE[/font]: In der realen Welt gibt es zahlreiche Beispiele für die Erzaufschwämmung, die in erster Linie mit einem seifenähnlichen Material und einer sauren oder alkalischen Wassermischung durchgeführt wird, wodurch die Materialien in der Lösung auf der Grundlage verschiedener physikalischer und chemischer Eigenschaften getrennt werden. Wenn Sie mehr darüber lesen möchten, schauen Sie unter Schaumflotation nach (beachten Sie das fehlende „a“ in flot), dem allgemeineren Begriff für diesen Prozess.
angels-leaching=Der dritte Schritt im Raffinationsprozess ist die Säurelaugung, bei der das Erzstück aus dem vorherigen Schritt in einer starken Säure aufgelöst wird, wobei ein wenig Schlacke zurückbleibt (was zu diesem Zeitpunkt vermutlich kein Problem darstellt). Dieses Erz-Säure-Gemisch wird zu relativ einheitlichen, hochreinen Kristallen auskristallisiert. Auch bei diesem Verfahren werden die chemischen Eigenschaften des Erzes ausgenutzt.\n\Nach dem allgemeinen Rezept werden Erzbrocken mit 10 Säuren verwendet und 2 Erzkristalle erzeugt.\nEin großer Teil der in diesem Schritt benötigten Säure kann aus dem vorherigen Schritt, der Flotation, stammen, aber es kann auch zusätzliche Säure erforderlich sein. Dies ist die erste Stufe, bei der keine Abfälle anfallen.
angels-leaching-notes=\n\n[font=default-bold]HINWEISE[/font]: Beispiele aus der realen Welt für die Säureauslaugung beziehen sich in der Regel auf die Halde, den Schotter und andere feste Abfallprodukte aus der Erzreinigungsanlage, die in eine große Grube mit einem versiegelten Betonsockel (wie ein großes Schwimmbad) geworfen und mit Säuren besprüht werden, die durch das aufgehäufte Durcheinander sickern und alle nützlichen Teile des Schmutzes auflösen, die zuvor übersehen wurden. Die Lauge (saure Lösung), die am Boden aufgefangen wird, ist reich an Mineralien, die in der Regel auskristallisiert und in die Schmelzanlage zurückgeführt werden.
angels-purification=Der letzte Schritt der Erzaufbereitung ist die ultimative Erzreinigung, bei der die letzten Verunreinigungen entfernt werden, um das bisher reinste Erz zu erhalten. Eine Kombination aus regenerativer Wärme, chemischer Verarbeitung und Elektrolyse bedeutet, dass in diesem Prozess keine zusätzlichen festen oder flüssigen Materialien benötigt oder verschwendet werden.\n\Nach dem allgemeinen Rezept werden die Erzkristalle in gereinigtes Erz umgewandelt.\nDieser Schritt des „Veredelns“ des Erzes wird nur selten angewandt, außer bei den exotischsten und seltensten Stoffen, um seine hohe Qualität vor der Verhüttung zu rechtfertigen.

; 1.2. Ore sorting
angels-ore-sorting=Bei der Erzsortieranlage handelt es sich um einen riesigen, hochmodernen Schwerkraftabscheider, eine Zentrifuge und einen Rostabscheider, die das raffinierte Erz in seine einzelnen Bestandteile (oder Metalle) für die Verhüttung zu hochwertigen Metallen filtern.
angels-ore-sorting-vanilla=\n\nUmwandlung der 4 zusammengesetzten Erze verschiedener Qualitäten in schmelzbare Erze, Nuggets und Kiesel, die eine andere Mischung ergeben. Die Nuggets und Kieselsteine können weiter zu mehr Metallerz verarbeitet werden. Je hochwertiger das gereinigte Erz ist, desto größer ist die Menge des schmelzbaren Erzes. Bei gereinigtem Erz fällt auch Metallschlacke an.
angels-ore-sorting-overhaul=\n\nVerwandelt die 6 Haupterze mit unterschiedlichen Raffinierungsqualitäten in eine Vielzahl von Metallerzen. \n[img=item/angels-ore4-crushed] Crushed ore erzeugt 2 Primärerze, 1 Sekundärerz und 1 [img=item/slag] Schlacke aus 4 zerkleinerten Erzen. \n[img=item/angels-ore4-chunk] Erzbrocken erzeugt 2 Primärerze, 1 Sekundärerz und 2 tertiäre Erze und 1 [img=item/slag] Schlacke aus 6 Brocken. \n[img=item/angels-ore4-crystal] Ore Crystals erzeugt 3 primäre, 1 sekundäre und 3 tertiäre Erze und 1 [img=item/slag] Schlacke aus 8 Kristallen.\n[img=item/angels-ore4-pure] Purified ore erzeugt 3 primäre, 2 sekundäre und 4 tertiäre Erze aus 9 gereinigten Erzen. \Die primären und sekundären Erze sind unten aufgeführt:\n- [img=item/angels-ore1] Saphirit und [img=item/angels-ore2] Jivolith: Primär [img=item/iron-ore] Eisen, sekundär [img=item/copper-ore] Kupfer\n- [img=item/angels-ore3] Stiratit und [img=item/angels-ore4] Crotinnium: Primär [img=item/copper-ore] Kupfer, sekundär [img=item/iron-ore] Eisen- [img=item/angels-ore6] Bobmonium: Primär [img=item/tin-ore] Zinn, sekundär [img=item/quartz] Silizium/Quarz\n- [img=item/angels-ore5] Rubyte: Primär [img=item/lead-ore] Blei, sekundär [img=item/nickel-ore] Nickel

; 1.3. Water processing
angels-water-processing=Verarbeiten Sie Meerwasser und Abwässer zu gereinigtem Wasser und gewinnen Sie nützliche Feststoffe in einer Hydroanlage [img=item/hydro-plant] zurück.
angels-water-processing-vanilla=\nWandeln Sie Wasser in nützliche [img=fluid/water-saline]Salzlösung für Salze und [img=fluid/water-purified]gereinigtes Wasser zur Unterstützung der Erzverarbeitung wie Flotation um. \Schwefel[img=item/sulfur] aus schwefelhaltigen Abwässern [img=fluid/water-yellow-waste] zurückgewinnen und in den Prozess zurückführen.
angels-water-processing-overhaul=\nUmwandlung von Wasser in [img=fluid/water-saline]Salzwasser für Salze und [img=fluid/water-purified]gereinigtes Wasser für die Erzverarbeitung, z.B. der Flotation/Aufschwämmung.\n\n
angels-water-processing-voiding=\n Du kannst überschüssige Flüssigkeiten vom Typ [img=Flüssigkeit/Wasser-salzig], [img=Flüssigkeit/Wasser-gereinigt], [img=Flüssigkeit/Wasser-mineralisiert] und Abwässer wie [img=Flüssigkeit/Wasser-gelber-Abfall] Schwefelabwässer in einem [img=item/clarifier]-Klärer entfernen, um sie aus dem Spiel zu entfernen.\n\n[font=default-bold]HINWEISE[/font]: Eine vollständige Liste der Flüssigkeiten, die geklärt werden können, findest Du im Eingabefeld für Rezeptflüssigkeiten am Klärbecken.\n
