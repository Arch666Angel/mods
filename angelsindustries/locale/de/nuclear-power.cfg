[technology-description]
angels-plutonium-power=Alles, was erforderlich ist, um überschüssiges Uran-238 zu verbrauchen. Wandeln Sie es durch Brutzyklen in Plutonium-240 um.
angels-thorium-power=Alles, was für die Nutzung thoriumbasierter Energiezyklen erforderlich ist. Wenn Sie überschüssiges Plutonium-240 oder Curium-245 haben, können Sie sich auch einen Energieschub verschaffen.
angels-fusion-power=Alles, was erforderlich ist, um Fusionsenergie durch den Einsatz von Myonen und Deuterium zu erzeugen und zu erhalten.
