angels-basic-blocks=Grundbausteine für den Bau von Gebäuden.
angels-advanced-blocks=Erweiterte Bausteine für den Bau von Gebäuden.

angels-components-mechanical=Mechanische Komponenten dienen als bewegliche Teile für Maschinen.
angels-components-construction=Konstruktionskomponenten sorgen für die Stabilität von Maschinen.
