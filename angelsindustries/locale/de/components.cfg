angels-rocket=Es ist an der Zeit, dass wir uns auf unseren atemberaubenden Abgang von diesem verlassenen Planeten konzentrieren...
angels-rocket-hull=Forschen Sie nach einem leichten, aber robusten Raketendesign, um Ihre Rakete über die maximale Q zu bringen.
angels-rocket-ion-thruster=Forsche nach dem kleinen Schub, der nötig ist, um dich über den Horizont zu heben.
angels-rocket-fusion-reactor=Ein wertvoller Reaktor, der alle Lebenserhaltungssysteme rund um die Uhr am Laufen hält, damit du weiter spielen kannst!
angels-rocket-shield-array=Eine reine Sicherheitsmaßnahme... Es gibt außerirdische Kräfte auf diesem Planeten, warum sollte es im Weltraum keine geben?

angels-glass-melting=Erste Methode zur Herstellung von geschmolzenem Glas.

[mod-setting-name]
angels-enable-components=Components overhaul (beta)
angels-return-ingredients=Components overhaul - Bergbaukomponenten
angels-components-stack-size=Components overhaul - Block stack size
angels-components-component-difficulty=Components overhaul - Intermediate component difficulty
angels-components-block-difficulty=Components overhaul - Block component difficulty

[mod-setting-description]
angels-enable-components=Entwicklungsstatus: [color=yellow][font=default-semibold]beta[/font][/color]\nAktiviert Elektronik und Baukomponenten als Zwischenprodukte.\nGebäude werden komplexer in der Herstellung.\n[img=utility/warning_icon] Aktiviert automatisch die Industrieüberholung.
angels-return-ingients=Wenn aktiviert, geben Gebäude ihre Zutaten bei der Abholung zurück. Wenn dies deaktiviert ist, wird das Gebäude selbst zurückgegeben, wie in Vanilla.\n[img=utility/warning_icon] Automatisch deaktiviert, wenn Komponenten deaktiviert sind.
angels-components-stack-size=Stapelgröße der Blockkomponenten.\n[img=utility/warning_icon] Wirkt sich nur auf das Gameplay aus, wenn die Komponentenüberholung aktiviert ist
angels-components-component-difficulty=Wie intensiv der Prozess ist, Ressourcen in Zwischenkomponenten zu verwandeln. \n[img=utility/warning_icon] Wirkt sich nur auf das Gameplay aus, wenn die Komponentenüberholung aktiviert ist
angels-components-block-difficulty=Wie intensiv der Prozess ist, Blockkomponenten aus den Zwischenkomponenten zu erstellen.\n[img=utility/warning_icon] Wirkt sich nur auf das Gameplay aus, wenn die Komponentenüberholung aktiviert ist

[string-mod-setting]
angels-components-component-difficulty-hard=Schwer
angels-components-component-difficulty-normal=Normal
angels-components-component-difficulty-easy=Einfach
angels-components-block-difficulty-hard=Schwer
angels-components-block-difficulty-normal=Normal
angels-components-block-difficulty-easy=Einfach

[string-mod-setting-description]
angels-components-component-difficulty-hard=Dies ist die Grundeinstellung ohne besondere Modifikationen.
angels-components-component-difficulty-normal=In dieser Einstellung liefert jedes Zwischenkomponentenrezept die doppelte Menge an Komponenten, aber die Herstellung dauert doppelt so lange. Diese Einstellung mildert den Druck der Ressourcenkosten.
angels-components-component-difficulty-easy=In dieser Einstellung liefert jedes Zwischenkomponentenrezept die doppelte Menge an Komponenten, ohne die Herstellungszeiten zu erhöhen. Diese Einstellung mildert den Druck der Ressourcenkosten und beschleunigt die Produktion.
angels-components-block-difficulty-hard=Dies ist die Grundeinstellung ohne spezielle Modifikationen.
angels-components-block-difficulty-normal=In dieser Einstellung liefert jedes Blockkomponentenrezept die doppelte Menge an Blöcken, aber die Herstellungszeit dauert doppelt so lang. Diese Einstellung mildert den Druck der Ressourcenkosten.
angels-components-block-difficulty-easy=In dieser Einstellung liefert jedes Blockkomponentenrezept die doppelte Menge an Blöcken, ohne die Herstellungszeiten zu erhöhen. Diese Einstellung mildert den Druck der Ressourcenkosten und beschleunigt die Produktion.
