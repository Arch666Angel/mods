[tips-and-tricks-name]
angelsaddons-storage=Angel's Addons Lageroptionen

[tips-and-tricks-description]
angelsaddons-storage=Dieser Mod fügt eine Vielzahl von Angels-Silos, Lagerhäusern und Druckbehältern hinzu, unabhängig vom Angels-Modset.
angelsaddons-storage-notes=\n\n[font=default-bold]HINWEIS[/font]: Silos sind 4x4-Lagerboxen mit 256 Stellplätzen (Logistikversionen variieren).\n[font=default-bold]HINWEIS[/font]: Lagerhäuser sind 6x6-Lagerboxen mit 768 Stellplätzen (Logistikversionen variieren).\n[font=default-bold]HINWEIS[/font]: Flüssigkeitslagertanks haben ein größeres Volumen als die Standardversion.
