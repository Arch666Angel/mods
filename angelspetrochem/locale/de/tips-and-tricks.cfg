; 1.1 Air filtering
angels-air-filtering=Luftreinigung

[tips-and-tricks-description]
angels-petrochem=Eine Mod, welche die petrochemische Verarbeitung überarbeitet, um sie komplexer und pseudo-realistischer zu machen (nicht übermäßig). \nRohstoffe müssen durch chemische Verarbeitungsketten verarbeitet und umgewandelt werden, um:\n__1__  zu gewinnen.\n Die Mod fügt auch eine neue Quelle hinzu: __2__
angels-air-filtering=Die Luftfilterung für [img=fluid/gas-oxygen] Sauerstoff und [img=fluid/gas-nitrogen] Stickstoff ist eine Schlüsseltechnologie, die eine effizientere Verhüttung durch die Verwendung von reinem Sauerstoff anstelle von Rohluft ermöglicht.\nSauerstoff und Stickstoff sind wichtige Ausgangsstoffe für zahlreiche industrielle Prozesse, von denen einige Teil dieser Mod sind.
angels-air-filtering-notes=\n\n[font=default-bold]HINWEISE[/font]: Sauerstoff und Stickstoff liegen in der Erdatmosphäre normalerweise bei etwa 21 Volumenprozent.\nDiese Mod verwendet ein anderes Verhältnis, um die frühe Verschwendung von Stickstoffgas und die späte Verschwendung von Sauerstoffgas zu reduzieren. (Nauvis ist nicht die Erde).

